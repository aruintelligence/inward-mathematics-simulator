name: Verify sample flip certificates
on:
  push:
  pull_request:
jobs:
  exact-partition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tools -p 'test_odd_sample_flip.py' -v
      - run: node --test tests/odd-flip-lab.test.cjs
      - run: node --test tests/odd-flip-verifier.test.cjs
      - run: python3 tools/verify_odd_sample_flip.py examples/odd-sample-flip-v1.json
      - run: python3 tools/odd_sample_flip.py --readings 48,49,50,51,85 --target 50 | diff - examples/odd-sample-flip-v1.json
      - run: python3 tools/render_odd_flip_report.py --check
      - run: python3 tools/verify_odd_sample_flip.py examples/odd-sample-flip-v2.json
      - run: python3 tools/odd_sample_flip.py --readings=-2,-1,0,1,35 --target=0 --low=-10 --high=40 | diff - examples/odd-sample-flip-v2.json
      - run: python3 tools/render_odd_flip_report.py examples/odd-sample-flip-v2.json --output odd-flip-signed-report.html --check
      - run: python3 tools/verify_odd_sample_flip.py examples/even-sample-flip-v3.json
      - run: python3 tools/odd_sample_flip.py --readings 40,45,50,80 --target 50 | diff - examples/even-sample-flip-v3.json
      - run: python3 tools/render_odd_flip_report.py examples/even-sample-flip-v3.json --output even-flip-report.html --check
