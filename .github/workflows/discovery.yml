name: Search mathematical candidates
on:
  push:
  pull_request:
jobs:
  finite-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools -p 'test_discover_candidates.py' -v
      - run: python3 tools/verify_discovery_archive.py examples/discovery-scan-v1.json
      - run: python3 tools/verify_estimator_identities.py examples/estimator-identities-v1.json
      - run: python3 tools/render_discovery_page.py --check
