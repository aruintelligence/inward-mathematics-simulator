name: Formal midpoint proof
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          use-mathlib-cache: true
          leanchecker: true
          axiom-audit: true
          axiom-audit-root: InwardFormal
