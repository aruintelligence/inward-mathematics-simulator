name: Verify interactive lab
on:
  push:
  pull_request:
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.cjs
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: python3 tools/differential_verify.py --seed 620810 --cases 64
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: differential-reproduction
          path: artifacts/differential/*.json
          if-no-files-found: ignore
